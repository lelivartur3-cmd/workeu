<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1264e8">
<title>WorkEU — Робота в Європі</title>
<style>
:root{
  --blue:#1264e8; --blue-dark:#0b4bb5; --ink:#122033; --muted:#66758f;
  --bg:#f5f7fb; --card:#fff; --line:#e3e8f2; --green:#16a34a; --orange:#f59e0b;
  --red:#dc2626; --shadow:0 8px 24px rgba(18,32,51,.08);
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.45;
  padding-bottom:80px;
}
a{color:var(--blue); text-decoration:none}
button{font:inherit; cursor:pointer; border:0; background:none; color:inherit}
input,select,textarea{font:inherit; color:inherit}

/* HEADER */
.header{
  position:sticky; top:0; z-index:50;
  background:#fff; border-bottom:1px solid var(--line);
  padding:10px 14px; display:flex; align-items:center; gap:10px;
}
.logo{font-weight:800; font-size:20px; color:var(--blue); display:flex; align-items:center; gap:6px}
.logo span{color:var(--ink)}
.header-actions{margin-left:auto; display:flex; gap:8px}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:10px 14px; border-radius:10px; font-weight:600; font-size:14px;
  transition:.15s; white-space:nowrap;
}
.btn-primary{background:var(--blue); color:#fff}
.btn-primary:active{background:var(--blue-dark)}
.btn-ghost{background:#eef3ff; color:var(--blue)}
.btn-outline{background:#fff; color:var(--ink); border:1px solid var(--line)}
.btn-green{background:var(--green); color:#fff}
.btn-block{width:100%}
.btn-lg{padding:14px 18px; font-size:16px; border-radius:12px}

/* HERO */
.hero{
  background:linear-gradient(135deg,#1264e8,#0b4bb5);
  color:#fff; padding:24px 16px 28px; text-align:center;
}
.hero h1{margin:0 0 6px; font-size:26px; line-height:1.2}
.hero p{margin:0; opacity:.9; font-size:15px}

/* SEARCH */
.search-wrap{
  max-width:900px; margin:-22px auto 0; padding:0 14px;
}
.search-card{
  background:#fff; border-radius:var(--radius); box-shadow:var(--shadow);
  padding:14px; display:grid; gap:10px;
}
.field{display:flex; flex-direction:column; gap:4px; text-align:left}
.field label{font-size:12px; font-weight:600; color:var(--muted); padding-left:4px}
.field input,.field select,.field textarea{
  width:100%; padding:12px 12px; border:1px solid var(--line);
  border-radius:10px; background:#fbfcff; font-size:15px; color:var(--ink);
}
.field select{appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%2366758f' stroke-width='2' fill='none'/></svg>"); background-repeat:no-repeat; background-position:right 12px center; padding-right:34px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--blue); border-color:var(--blue); background:#fff}

/* FILTERS */
.filters{
  max-width:900px; margin:14px auto 0; padding:0 14px;
  display:flex; gap:8px; overflow-x:auto; scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; padding:8px 14px; border-radius:20px; background:#fff;
  border:1px solid var(--line); font-size:13px; font-weight:600; color:var(--muted);
}
.chip.active{background:var(--blue); color:#fff; border-color:var(--blue)}

/* RESULTS */
.results{max-width:900px; margin:14px auto 0; padding:0 14px}
.results-count{font-size:14px; color:var(--muted); margin:0 0 10px; padding-left:4px}
.jobs{display:grid; gap:10px}

/* JOB CARD */
.card{
  background:#fff; border-radius:var(--radius); padding:14px;
  box-shadow:var(--shadow); display:block; color:inherit;
  border:1px solid transparent; transition:.15s;
}
.card:active{transform:scale(.99); border-color:var(--blue)}
.card-top{display:flex; align-items:flex-start; gap:10px}
.card-title{font-weight:700; font-size:16px; margin:0 0 2px}
.card-company{font-size:13px; color:var(--muted); margin:0}
.card-fav{
  margin-left:auto; font-size:22px; line-height:1;
  padding:2px 6px; border-radius:8px;
}
.card-meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.tag{
  font-size:12px; font-weight:600; padding:5px 9px; border-radius:8px;
  background:#eef3ff; color:var(--blue);
}
.tag.green{background:#e7f7ee; color:var(--green)}
.tag.orange{background:#fff3e0; color:#b45309}
.tag.gray{background:#eef1f6; color:var(--muted)}
.card-salary{font-weight:800; color:var(--ink); margin-top:8px; font-size:15px}

/* EMPTY */
.empty{
  text-align:center; padding:40px 20px; color:var(--muted);
  background:#fff; border-radius:var(--radius); box-shadow:var(--shadow);
}

/* MODAL */
.modal{
  position:fixed; inset:0; background:rgba(10,18,35,.55);
  z-index:100; display:none; align-items:flex-end; justify-content:center;
  padding:0;
}
.modal.open{display:flex}
.modal-inner{
  background:#fff; width:100%; max-width:700px;
  max-height:92vh; overflow-y:auto;
  border-radius:18px 18px 0 0; padding:18px 16px 110px;
  animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.modal-close{
  position:sticky; top:0; float:right; margin:-8px -4px 0 0;
  width:34px; height:34px; border-radius:50%;
  background:#eef1f6; font-size:20px; line-height:34px; text-align:center;
  color:var(--ink); z-index:2;
}
.detail h2{margin:4px 0 4px; font-size:22px}
.detail .company{color:var(--muted); margin:0 0 14px; font-size:15px}
.detail-section{margin-top:18px}
.detail-section h3{margin:0 0 6px; font-size:15px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em}
.detail-section p{margin:0; font-size:15px}
.info-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px}

/* CONTACT BUTTONS */
.contact-list{display:grid; gap:10px; margin-top:10px}
.contact-btn{
  display:flex; align-items:center; gap:12px; padding:14px;
  background:#f7f9fe; border-radius:12px; font-weight:600; font-size:15px;
  border:1px solid var(--line); color:var(--ink);
}
.contact-btn:active{background:#eef3ff}
.contact-btn .ico{font-size:20px; width:28px; text-align:center}
.contact-btn small{display:block; font-weight:500; color:var(--muted); font-size:12px; margin-top:2px}

/* STICKY BOTTOM */
.sticky-bottom{
  position:fixed; bottom:0; left:0; right:0; z-index:60;
  background:#fff; border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  display:flex; gap:8px; max-width:700px; margin:0 auto;
}
.sticky-bottom .btn{flex:1}

/* FORM */
.form-row{display:grid; gap:10px; margin-top:10px}
.checkbox-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px}
.checkbox{
  display:flex; align-items:center; gap:8px; padding:10px 12px;
  background:#f7f9fe; border-radius:10px; border:1px solid var(--line);
  font-size:14px; font-weight:600;
}
.checkbox input{width:18px; height:18px; accent-color:var(--blue)}
.success{
  text-align:center; padding:30px 10px;
}
.success .big{font-size:52px}
.success h3{margin:10px 0 6px; font-size:20px}
.success p{color:var(--muted); margin:0 0 20px}

/* FOOTER */
.footer{
  max-width:900px; margin:30px auto 0; padding:20px 14px 30px;
  color:var(--muted); font-size:13px; text-align:center;
}
.footer a{color:var(--muted); margin:0 8px}

@media (min-width:640px){
  .search-card{grid-template-columns:1.2fr 1fr 1fr auto; align-items:end; padding:16px}
  .search-card .btn-lg{padding:12px 22px}
  .modal{align-items:center; padding:20px}
  .modal-inner{border-radius:18px; padding-bottom:18px; max-height:86vh}
  .jobs{grid-template-columns:1fr 1fr}
  body{padding-bottom:0}
  .sticky-bottom{position:sticky; max-width:900px; border-radius:14px; box-shadow:var(--shadow); margin:14px auto 0}
}
</style>
</head>
<body>

<header class="header">
  <div class="logo">Work<span>EU</span></div>
  <div class="header-actions">
    <button class="btn btn-ghost" id="favBtn">❤️ <span id="favCount">0</span></button>
    <button class="btn btn-outline" onclick="alert('Реєстрація буде додана пізніше. Зараз сайт працює в гостьовому режимі.')">Вхід</button>
  </div>
</header>

<section class="hero">
  <h1>Робота в Європі</h1>
  <p>Знайди вакансію за 2 хвилини:'. Без реєстрації.</p>
</section>

П<div class="search-wrap">
  <form class="search-card" idра="searchForm">
    <div class="field">
     ва <label>Що шукаєте?</label>
      <input id="q" placeholder="Водій, склад, сварщик...">
    </div>
    <div class="field">
      <label>Країна</label>
      <select id="country"><option value="">Усі країни</option></select>
    </div>
    <div class="field">
      <label>Місто</label>
      <select id="city"><option value="">Усі міста</option></select>
    </div>
    <button type="submit" class="btn btn-primary btn-lg">🔍 Знайти</button>
  </form>
</div>

<div class="filters" id="filters"></div>

<section class="results">
  <p class="results-count" id="count"></p>
  <div class="jobs" id="jobs"></div>
</section>

<footer class="footer">
  <div>© 2026 WorkEU — пошук роботи в Європі</div>
  <div style="margin-top:8px">
    <a href="#" onclick="alert('Скоро');return false">Про нас</a>
    <a href="#" onclick="alert('Скоро');return false">Роботодавцям</a>
    <a href="#" onclick="alert('Скоро');return false">Контакти</a>
  </div>
</footer>

<!-- Модалка вакансії -->
<div class="modal" id="detailModal">
  <div class="modal-inner" id="detailInner"></div>
</div>

<!-- Модалка зв'язку -->
<div class="modal" id="contactModal">
  <div class="modal-inner">
    <button class="modal-close" onclick="closeModal('contactModal')">✕</button>
    <h2 style="margin:4px 0 4px">Зв'язатися з роботодавцем</h2>
    <p style="color:var(--muted);margin:0 0 8px" id="contactJobTitle"></p>
    <div class="contact-list" id="contactList"></div>
  </div>
</div>

<!-- Модалка заявки -->
<div class="modal" id="formModal">
  <div class="modal-inner">
    <button class="modal-close" onclick="closeModal('formModal')">✕</button>
    <div id="formContent">
      <h2 style="margin:4px 0 4px">Оставити заявку</h2>
      <p style="color:var(--muted);margin:0">Коротка форма. Без реєстрації та пароля.</p>
      <form id="applyForm" class="form-row">
        <div class="field"><label>Ваше ім'я</label><input required id="fName" placeholder="Введіть ім'я"></div>
        <div class="field"><label>Номер телефону</label><input required id="fPhone" type="tel" placeholder="+420 ___ ___ ___"></div>
        <div class="field"><label>Як з вами зв'язатися?</label>
          <div class="checkbox-grid">
            <label class="checkbox"><input type="checkbox" name="ch" value="Телефон" checked> Телефон</label>
            <label class="checkbox"><input type="checkbox" name="ch" value="Viber"> Viber</label>
            <label class="checkbox"><input type="checkbox" name="ch" value="WhatsApp"> WhatsApp</label>
            <label class="checkbox"><input type="checkbox" name="ch" value="Telegram"> Telegram</label>
          </div>
        </div>
        <div class="field"><label>Повідомлення</label><textarea id="fMsg" rows="3" placeholder="Наприклад: Здравствуйте, заинтересовала ваша вакансия."></textarea></div>
        <button type="submit" class="btn btn-green btn-lg btn-block">Відправити заявку</button>
      </form>
    </div>
  </div>
</div>

<script>
/* ============ ДАНІ ============ */
const COUNTRIES = [
  {code:'cz', name:'Чехія', currency:'Kč', cities:['Прага','Брно','Пльзень','Острава','Оломоуц','Йиглава','Ліберець','Градець-Кралове']},
  {code:'pl', name:'Польща', currency:'zł', cities:['Варшава','Краків','Вроцлав','Гданськ','Познань','Лодзь','Катовіце','Люблін']},
  {code:'de', name:'Німеччина', currency:'€', cities:['Берлін','Мюнхен','Гамбург','Кельн','Франкфурт','Штутгарт','Дюссельдорф']},
  {code:'sk', name:'Словаччина', currency:'€', cities:['Братислава','Кошице','Жиліна','Нітра']},
  {code:'at', name:'Австрія', currency:'€', cities:['Відень','Грац','Лінц','Зальцбург']},
  {code:'it', name:'Італія', currency:'€', cities:['Рим','Мілан','Неаполь','Турин','Болонья']},
  {code:'es', name:'Іспанія', currency:'€', cities:['Мадрид','Барселона','Валенсія','Севілья']},
  {code:'nl', name:'Нідерланди', currency:'€', cities:['Амстердам','Роттердам','Гаага','Утрехт']}
];

const PROFESSIONS = ['Водій','Склад','Будівництво','Сварщик','Різноробочий','Кухар','Офіціант','Прибиральник','Касир','Охоронець','Електрик','Сантехнік','Медсестра','Логіст','Оператор'];

const JOBS = [
  {id:1, title:'Складський працівник', company:'ABC Logistics', country:'cz', city:'Прага',
   salMin:35000, salMax:45000, housing:true, noExp:true, contract:true,
   description:'Робота на сучасному складі. Комплектація замовлень, сканування, пакування.',
   requirements:'Уважність, базова українська/чеська, готовність до фізичної роботи.',
   conditions:'Графік 5/2, 8-10 годин. Офіційне оформлення. Житло надається.',
   about:'ABC Logistics — міжнародна логістична компанія з 15-річним досвідом.',
   contacts:{phone:'+420111222333', viber:true, whatsapp:true, telegram:'abclogistics', email:'hr@abc.cz', form:true}},

  {id:2, title:'Водій категорії B', company:'EuroTrans', country:'cz', city:'Брно',
   salMin:40000, salMax:55000, housing:true, noExp:false, contract:true,
   description:'Доставка товарів по Чехії та Словаччині. Автомобіль компанії.',
   requirements категорії B, досвід від 1 року, знання чеської на базовому рівні.',
   conditions:'Графік 5/2, офіційне працевлаштування, оплата житла частково.',
   about:'EuroTrans — перевізник з парком 120 авто.',
   contacts:{phone:'+420222333444', whatsapp:true, email:'work@eurotrans.cz', form:true}},

  {id:3, title:'Сварщик MIG/MAG', company:'MetalPol', country:'pl', city:'Вроцлав',
   salMin:5500, salMax:7500, housing:true, noExp:false, contract:true,
   description:'Зварювання металоконструкцій. Робота на заводі.',
   requirements:'Досвід від 2 років, сертифікат зварювальника вітається.',
   conditions:'Графік 5/2, понаднормові, житло надається.',
   about:'MetalPol — металообробний завод під Вроцлавом.',
   contacts:{phone:'+48111222333', viber:true, telegram:'metalpol_hr', form:true}},

  {id:4, title:'Будівельник-оздоблювач', company:'BauMeister', country:'de', city:'Берлін',
   salMin:2200, salMax:2800, housing:true, noExp:false, contract:true,
   description:'Оздоблювальні роботи всередині приміщень. Гіпсокартон, штукатурка.',
   requirements:'Досвід від 1 року, німецька на базовому рівні.',
   conditions:'Графік 5/2, 8 годин, офіційне оформлення.',
   about:'BauMeister — будівельна компанія в Берліні.',
   contacts:{phone:'+491234567890', whatsapp:true, email:'info@baumeister.de', form:true}},

  {id:5, title:'Кухар на кухню', company:'RestoVienna', country:'at', city:'Відень',
   salMin:1800, salMax:2200, housing:false, noExp:true, contract:true,
   description:'Приготування страв європейської кухні. Робота в ресторані.',
   requirements:'Досвід не обов\'язковий, навчимо.',
   conditions:'Графік змінний, харчування на роботі.',
   about:'Сімейний ресторан у центрі Відня.',
   contacts:{phone:'+431234567', whatsapp:true, telegram:'restovienna', form:true}},

  {id:6, title:'Різноробочий на ферму', company:'Farma Zelená', country:'sk', city:'Нітра',
   salMin:900, salMax:1200, housing:true, noExp:true, contract:false,
   description:'Сезонні роботи: збір овочів, догляд за тваринами.',
   requirements:'Без досвіду, фізична витривалість.',
   conditions:'Проживання на фермі безкоштовно, харчування.',
   about:'Сімейна ферма в Словаччині.',
   contacts:{phone:'+421912345678', viber:true, form:true}}
];

/* ============ СТАН ============ */
const state = { q:'', country:'', city:'', profession:'', favs: JSON.parse(localStorage.getItem('favs')||'[]') };

/* ============ РЕНДЕР ФІЛЬТРІВ ============ */
function renderCountryOptions(){
  const sel = document.getElementById('country');
  COUNTRIES.forEach(c => {
    const o = document.createElement('option');
    o.value = c.code; o.textContent = c.name;
    sel.appendChild(o);
  });
}
function renderCityOptions(code){
  const sel = document.getElementById('city');
  sel.innerHTML = '<option value="">Усі міста</option>';
  const c = COUNTRIES.find(x => x.code === code);
  if(!c) return;
  c.cities.forEach(city => {
    const o = document.createElement('option');
    o.value = city; o.textContent = city;
    sel.appendChild(o);
  });
}
function renderProfessionChips(){
  const box = document.getElementById('filters');
  box.innerHTML = '<button class="chip active" data-p="">Усі професії</button>';
  PROFESSIONS.forEach(p => {
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.p = p; b.textContent = p;
    box.appendChild(b);
  });
  box.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      box.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      state.profession = chip.dataset.p;
      renderJobs();
    });
  });
}

/* ============ ПОШУК ============ */
function filteredJobs(){
  const q = state.q.trim().toLowerCase();
  return JOBS.filter(j => {
    if(state.country && j.country !== state.country) return false;
    if(state.city && j.city !== state.city) return false;
    if(state.profession && !j.title.toLowerCase().includes(state.profession.toLowerCase())) return false;
    if(q){
      const hay = (j.title + ' ' + j.company + ' ' + j.description).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ============ РЕНДЕР ВАКАНСІЙ ============ */
function money(j){
  const c = COUNTRIES.find(x => x.code === j.country);
  const cur = c ? c.currency : '';
  return j.salMin.toLocaleString('uk-UA') + '–' + j.salMax.toLocaleString('uk-UA') + ' ' + cur;
}
function renderJobs(){
  const jobs = filteredJobs();
  const countEl = document.getElementById('count');
  countEl.textContent = jobs.length ? ('Знайдено: ' + jobs.length) : '';
  const box = document.getElementById('jobs');
  if(!jobs.length){
    box.innerHTML = '<div class="empty">😕 Нічого не знайдено.<br>Спробуйте змінити фільтри.</div>';
    return;
  }
  box.innerHTML = jobs.map(j => {
    const c = COUNTRIES.find(x => x.code === j.country);
    const fav = state.favs.includes(j.id) ? '❤️' : '🤍';
    return `<div class="card" data-id="${j.id}">
      <div class="card-top">
        <div style="flex:1">
          <p class="card-title">${j.title}</p>
          <p class="card-company">🏢 ${j.company}</p>
        </div>
        <button class="card-fav" data-fav="${j.id}">${fav}</button>
      </div>
      <div class="card-meta">
        <span class="tag">📍 ${j.city}, ${c ? c.name : ''}</span>
        ${j.housing ? '<span class="tag green">🏠 Житло</span>' : ''}
        ${j.noExp ? '<span class="tag green">✅ Без досвіду</span>' : ''}
        ${j.contract ? '<span class="tag gray">📄 Офіційно</span>' : ''}
      </div>
      <div class="card-salary">💰 ${money(j)}</div>
    </div>`;
  }).join('');
  box.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', e => {
      if(e.target.dataset.fav){
        toggleFav(parseInt(e.target.dataset.fav));
        return;
      }
      openDetail(parseInt(el.dataset.id));
    });
  });
}

/* ============ ІЗБРАНЕ ============ */
function toggleFav(id){
  const i = state.favs.indexOf(id);
  if(i >= 0) state.favs.splice(i,1); else state.favs.push(id);
  localStorage.setItem('favs', JSON.stringify(state.favs));
  document.getElementById('favCount').textContent = state.favs.length;
  renderJobs();
}
document.getElementById('favBtn').addEventListener('click', () => {
  if(!state.favs.length){ alert('У вас поки немає збережених вакансій.'); return; }
  state.q=''; state.country=''; state.city=''; state.profession='';
  document.getElementById('q').value='';
  document.getElementById('country').value='';
  document.getElementById('city').innerHTML='<option value="">Усі міста</option>';
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  document.querySelector('.chip[data-p=""]').classList.add('active');
  renderJobs();
});

/* ============ ВІДКРИТТЯ ВАКАНСІЇ ============ */
function openDetail(id){
  const j = JOBS.find(x => x.id === id);
  if(!j) return;
  const c = COUNTRIES.find(x => x.code === j.country);
  const inner = document.getElementById('detailInner');
  inner.innerHTML = `
    <button class="modal-close" onclick="closeModal('detailModal')">✕</button>
    <div class="detail">
      <h2>${j.title}</h2>
      <p class="company">🏢 ${j.company}</p>
      <div class="info-row">
        <span class="tag">📍 ${j.city}, ${c ? c.name : ''}</span>
        ${j.housing ? '<span class="tag green">🏠 Житло</span>' : ''}
        ${j.noExp ? '<span class="tag green">✅ Без досвіду</span>' : ''}
        ${j.contract ? '<span class="tag gray">📄 Офіційне</span>' : ''}
      </div>
      <div class="card-salary" style="font-size:18px">💰 ${money(j)} / місяць</div>

      <div class="detail-section"><h3>Обов'язки</h3><p>${j.description}</p></div>
      <div class="detail-section"><h3>Вимоги</h3><p>${j.requirements}</p></div>
      <div class="detail-section"><h3>Умови</h3><p>${j.conditions}</p></div>
      <div class="detail-section"><h3>Про роботодавця</h3><p>${j.about}</p></div>
    </div>

    <div class="sticky-bottom" style="position:sticky;margin-top:16px">
      <button class="btn btn-primary btn-lg" style="flex:2" onclick="openContact(${j.id})">📞 Зв'язатися</button>
      <button class="btn btn-outline btn-lg" onclick="toggleFav(${j.id});this.textContent='${state.favs.includes(j.id)?'❤️':'🤍'}'">${state.favs.includes(j.id)?'❤️':'🤍'}</button>
    </div>
  `;
  document.getElementById('detailModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(id){
  document.getElementById(id).classList.remove('open');
  document.body.style.overflow = '';
}

/* ============ КОНТАКТИ ============ */
function openContact(id){
  const j = JOBS.find(x => x.id === id);
  if(!j) return;
  document.getElementById('contactJobTitle').textContent = j.title + ' — ' + j.company;
  const c = j.contacts || {};
  const list = [];
  if(c.phone){
    list.push(`<a class="contact-btn" href="tel:${c.phone.replace(/\s/g,'')}">
      <span class="ico">📞</span><span>Позвонити<small>${c.phone}</small></span></a>`);
  }
  if(c.viber && c.phone){
    list.push(`<a class="contact-btn" href="viber://chat?number=${encodeURIComponent(c.phone.replace(/\s/g,''))}">
      <span class="ico">💬</span><span>Написати у Viber<small>${c.phone}</small></span></a>`);
  }
  if(c.whatsapp && c.phone){
    list.push(`<a class="contact-btn" href="https://wa.me/${c.phone.replace(/[^\d]/g,'')}" target="_blank" rel="noopener">
      <span class="ico">💬</span><span>Написати у WhatsApp<small>${c.phone}</small></span></a>`);
  }
  if(c.telegram){
    list.push(`<a class="contact-btn" href="https://t.me/${c.telegram}" target="_blank" rel="noopener">
      <span class="ico">✈️</span><span>Написати у Telegram<small>@${c.telegram}</small></span></a>`);
  }
  if(c.email){
    list.push(`<a class="contact-btn" href="mailto:${c.email}?subject=Вакансія: ${encodeURIComponent(j.title)}">
      <span class="ico">✉️</span><span>Написати на Email<small>${c.email}</small></span></a>`);
  }
  if(c.form){
    list.push(`<button class="contact-btn" onclick="closeModal('contactModal');openApply(${j.id})">
      <span class="ico">📩</span><span>Залишити заявку<small>Без реєстрації</small></span></button>`);
  }
  if(!list.length){
    list.push('<div class="empty">Роботодавець не вказав контакти.</div>');
  }
  document.getElementById('contactList').innerHTML = list.join('');
  document.getElementById('contactModal').classList.add('open');
}

/* ============ ЗАЯВКА ============ */
let applyJobId = null;
function openApply(id){
  applyJobId = id;
  document.getElementById('formContent').style.display = '';
  document.getElementById('applyForm').reset();
  document.querySelectorAll('#applyForm .checkbox input')[0].checked = true;
  document.getElementById('formModal').classList.add('open');
}
document.getElementById('applyForm').addEventListener('submit', e => {
  e.preventDefault();
  // Тут пізніше буде відправка на backend.
  // Поки що зберігаємо локально.
  const data = {
    jobId: applyJobId,
    name: document.getElementById('fName').value,
    phone: document.getElementById('fPhone').value,
    channels: [...document.querySelectorAll('#applyForm .checkbox input:checked')].map(x=>x.value),
    message: document.getElementById('fMsg').value,
    date: new Date().toISOString()
  };
  const arr = JSON.parse(localStorage.getItem('applications')||'[]');
  arr.push(data);
  localStorage.setItem('applications', JSON.stringify(arr));
  document.getElementById('formContent').innerHTML = `
    <div class="success">
      <div class="big">✅</div>
      <h3>Заявку відправлено</h3>
      <p>Роботодавець отримає ваші дані та зв'яжеться з вами обраним способом.</p>
      <button class="btn btn-primary btn-lg btn-block" onclick="closeModal('formModal')">Повернутися до вакансій</button>
    </div>`;
});

/* ============ ПОДІЇ ============ */
document.getElementById('country').addEventListener('change', e => {
  state.country = e.target.value;
  state.city = '';
  renderCityOptions(state.country);
  renderJobs();
});
document.getElementById('city').addEventListener('change', e => {
  state.city = e.target.value;
  renderJobs();
});
document.getElementById('searchForm').addEventListener('submit', e => {
  e.preventDefault();
  state.q = document.getElementById('q').value;
  renderJobs();
  document.querySelector('.results').scrollIntoView({behavior:'smooth'});
});
document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', e => { if(e.target === m) closeModal(m.id); });
});

/* ============ СТАРТ ============ */
renderCountryOptions();
renderProfessionChips();
renderJobs();
document.getElementById('favCount').textContent = state.favs.length;
</script>
</body>
</html>
